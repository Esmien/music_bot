[tool.poetry]
name = "music-bot"
version = "0.1.0"
description = ""
authors = ["Владислав Сороковых <black.walf16@gmail.com>"]
readme = "README.md"
# Приложение, а не библиотека: сам пакет не собирается и не ставится,
# поэтому poetry install безопасно вызывать даже без --no-root
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12.0,<3.15"
aiogram = ">=3.31.0,<4.0.0"
httpx = ">=0.28.1,<0.29.0"
python-dotenv = ">=1.2.3,<2.0.0"
sqlalchemy = ">=2.0.36,<3.0.0"
aiosqlite = ">=0.20.0,<0.21.0"
aiofiles = ">=25.1.0,<26.0.0"
asyncpg = ">=0.30.0,<0.31.0"
alembic = ">=1.14.0,<2.0.0"
redis = ">=5.2.0,<6.0.0"
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
taskiq = ">=0.11.7,<0.12.0"
taskiq-aio-pika = ">=0.4.1,<0.5.0"
tenacity = ">=8.0.0,<9.0.0"
mypy = "^2.3.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2,<9.0.0"
pytest-asyncio = ">=1.0.0,<2.0.0"
pytest-cov = ">=6.1.1,<7.0.0"
ruff = ">=0.9.0"
fakeredis = "^2.38.0"
lupa = "^2.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Фиксируем версию Python для правильных подсказок
target-version = "py312"
force-exclude = true

exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "alembic",
    "migrations",
    "infra"
]

line-length = 120

[tool.ruff.lint]
select = [
    "E", # Стандартные ошибки PEP8 (pycodestyle)
    "F", # Логические ошибки, неиспользуемые переменные (Pyflakes)
    "I", # Автоматическая сортировка импортов (isort)
    "UP", # Автоматический апгрейд синтаксиса до Python 3.12 (pyupgrade)
    "B", # Поиск неочевидных багов, например, mutable defaults (flake8-bugbear)
    "C4", # Улучшение работы со списками и словарями (flake8-comprehensions)
    "SIM", # Советы по упрощению логики кода (flake8-simplify)
]

# Какие правила игнорировать (обычно это конфликтующие с форматтером вещи)
ignore = [
    "B008", # Разрешаем вызовы функций в аргументах
]

[tool.ruff.format]
# Настройки форматтера
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
# Группировка импортов, чтобы всё было красиво
known-first-party = ["core", "domains", "fsm", "handlers", "keyboards", "services"] # Модули проекта отделяются пустой строкой

[tool.pytest.ini_options]
# Режим "auto" — то самое "always": async-тесты и фикстуры выполняются
# без @pytest.mark.asyncio и ручных обёрток
asyncio_mode = "auto"
# Явный scope цикла событий для фикстур — без него pytest-asyncio
# сыплет deprecation-предупреждения при каждом запуске
asyncio_default_fixture_loop_scope = "function"
# Корень проекта и каталог src в sys.path: тесты импортируют config, models, handlers напрямую
pythonpath = [".", "src"]
testpaths = ["src/domains", "tests"]
markers = [
    "unit: быстрые изолированные тесты (сеть и БД замоканы)",
    "integration: тесты с реальной in-memory БД",
    "redis: интеграционные тесты, требующие реального Redis-сервера",
    "redis_real: интеграционные тесты с настоящим Redis (не fakeredis)",
]
# Покрытие включено по умолчанию; источники заданы в [tool.coverage.run]
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
# Измеряем только код проекта — тесты и зависимости не считаем.
# bot.py не включён: это точка входа с polling, в тестах не импортируется,
# из-за чего coverage предупреждал "Module bot was never imported"
source = ["core", "domains"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Исключаем алембик и миграции из строгих проверок
exclude = [
    "^migrations/",
    "^alembic/",
]

# Постепенное внедрение: начинаем с core и domains, тесты пока без strict mode
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
