services:
  bot:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-bot
    restart: always
    stop_grace_period: 30s
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  generation-worker:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-generation-worker
    restart: always
    stop_grace_period: 30s
    command: ["python", "-u", "-m", "workers.taskiq_worker", "generation"]
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  enricher-worker:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-enricher-worker
    restart: always
    stop_grace_period: 30s
    command: ["python", "-u", "-m", "workers.taskiq_worker", "enricher"]
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    restart: always
    # Порты наружу не пробрасываем: на сервере уже крутится локальный PostgreSQL,
    # бот и alembic работают только внутри docker-сети (POSTGRES_HOST=postgres)
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis-test
    profiles:
      - test
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
