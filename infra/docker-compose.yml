services:
  bot:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-bot
    restart: always
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  generation-worker:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-generation-worker
    restart: always
    command: ["python", "-u", "-m", "workers.taskiq_worker", "generation"]
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  enricher-worker:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-enricher-worker
    restart: always
    command: ["python", "-u", "-m", "workers.taskiq_worker", "enricher"]
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  evaluation-worker:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-evaluation-worker
    restart: always
    command: ["python", "-u", "-m", "workers.taskiq_worker", "evaluation"]
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  credits-worker:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-credits-worker
    restart: always
    command: ["python", "-u", "-m", "workers.taskiq_worker", "credits"]
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  feedback-worker:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-feedback-worker
    restart: always
    command: [ "python", "-u", "-m", "workers.taskiq_worker", "feedback" ]
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    restart: always
    # Порты наружу не пробрасываем: на сервере уже крутится локальный PostgreSQL,
    # бот и alembic работают только внутри docker-сети (POSTGRES_HOST=postgres)
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Для локального взаимодействия
    #ports:
    #  - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: always
    volumes:
      - redis_data:/data
    # Для локального взаимодействия
    #ports:
    #  - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-songai}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-songai}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
