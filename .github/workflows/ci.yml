name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Реальный PostgreSQL для проверки миграций (alembic upgrade head)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_test_db
        ports:
          - 5432:5432
        # Теперь здесь обычный текст, GitHub ругаться не будет
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Переменные нужны config.py: он валидирует окружение при импорте,
    # а env.py миграций собирает из них DATABASE_URL.
    # Сервис-контейнеры GitHub Actions доступны на 127.0.0.1
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOT_ACCESS_KEY: ${{ secrets.BOT_ACCESS_KEY }}
      SONG_PRICE: ${{ secrets.SONG_PRICE }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.SONG_PORT }}
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: ci_test_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Run migrations
        run: poetry run alembic upgrade head

      - name: Run tests
        run: poetry run pytest
