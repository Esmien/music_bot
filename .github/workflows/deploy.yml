name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PROJECT_DIR }}
            git reset --hard
            git pull origin master
            # Пересобираем все сервисы: бот, воркеры, postgres, redis, rabbitmq
            docker compose up -d --build
            docker image prune -f
            # Даём времени для:
            # 1. Применения миграций (entrypoint бота)
            # 2. Старта всех сервисов
            # 3. Регистрации воркеров в RabbitMQ
            sleep 15
            # Проверяем миграции и статус всех контейнеров
            docker compose exec -T bot alembic current
            docker compose ps
            # Проверяем логи воркеров на наличие ошибок старта
            docker compose logs --tail=50 worker
